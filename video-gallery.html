<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="video-gallery.css" />
  </head>
  <body>
    <div class="video-container">
      <div class="video-row">
        <div class="video-item">
          <div class="video-wrapper">
            <iframe
              src="https://www.youtube.com/embed/MsfCNsApHH8?si=_jDZ6CnYams2llN-"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>
          </div>
        </div>

        <div class="video-item">
          <div class="video-wrapper">
            <iframe
              src="https://www.youtube.com/embed/SVbvHROlUc8?si=ok716V_3RipOrVPJ"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>
          </div>
        </div>

        <div class="video-item">
          <div class="video-wrapper">
            <iframe
              src="https://www.youtube.com/embed/xuFXE8OIGO0?si=QPnnY0zMMQmWo7Mj"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>
          </div>
        </div>
      </div>
    </div>

    <script src="video-gallery.js"></script>
  </body>
</html>
